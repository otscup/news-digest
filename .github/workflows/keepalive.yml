name: keepalive（直接跑脚本，确保每小时至少 1 次）

on:
  schedule:
    # 每 10 分钟运行脚本（与主 workflow 独立）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write    # 需要提交 seen.json / last_run.json

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --quiet -r requirements.txt

      - name: 运行热点推送（脚本自带 55 分钟防抖，不会重复推送）
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          python news_bot.py
